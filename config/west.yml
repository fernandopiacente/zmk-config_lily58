manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    # OLED animations (nice_oled shield), see build.yaml and lily58.conf.
    - name: mctechnology17
      url-base: https://github.com/mctechnology17
  projects:
    - name: zmk
      remote: zmkfirmware
      # Pinned to v0.3 for reliable deep sleep: ZMK `main` (Zephyr 4.1) has open
      # deep-sleep wake/drain regressions (zmk#3195/#3207). Moving back to main
      # needs THREE coordinated edits: this revision, the workflow ref in
      # .github/workflows/build.yml, and the board name in build.yaml
      # (`nice_nano_v2` here vs `nice_nano@2.0.0//zmk` on main).
      revision: v0.3
      import: app/west.yml
    # nice_oled: the module's ZMK v0.3 branch, pinned to a commit so a change
    # upstream can't break the build. To update, put a newer commit of the
    # zmk-v0.3 branch here (the main branch targets newer ZMK, not v0.3).
    - name: zmk-nice-oled
      remote: mctechnology17
      revision: 84a98807fd97f8930859d1eb633966aaec17b72a
  self:
    path: config
