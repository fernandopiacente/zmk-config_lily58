# Uncomment to enable encoder
# CONFIG_EC11=y
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# OLED (128x32 on each half) with the nice_oled animated screens.
#   Left (central): WPM with the Bongo Cat animation, layer, battery,
#                   Bluetooth profile, modifiers and Caps Lock.
#   Right (peripheral): the cat animation, battery and connection.
# Other animations for the right half: set the CAT line to n and one of
# GEM, HEAD, POKEMON or SPACEMAN to y (CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_*).
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
# Only ONE WPM animation: Bongo Cat and Luna share variable names in the
# module, so turning both on fails to link. Bongo Cat is the module default.
CONFIG_NICE_OLED_WIDGET_WPM_BONGO_CAT=y
CONFIG_NICE_OLED_WIDGET_WPM_LUNA=n
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL=y
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_CAT=y

# Deep sleep after 15 minutes of inactivity; a keypress wakes the half (~1-2 s
# reconnect, the wake key itself is not sent). Reliable because ZMK is pinned
# to v0.3 and Studio is off. The OLEDs turn off when the halves sleep.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Better connection on bt. Radio TX power is set PER HALF (lily58_left.conf /
# lily58_right.conf): BT_CTLR_TX_PWR is a Kconfig choice, so a shared value
# can't be overridden by one half.
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# No pairing code: the computer pairs straight away, without asking you to
# type a 6-digit code on the keyboard. Set explicitly so nothing turns it on
# (ZMK_BLE_EXPERIMENTAL_SEC/FEATURES would otherwise imply it).
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n

# Battery level
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
